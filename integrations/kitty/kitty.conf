# ==============================================================
# KITTY
# ==============================================================


# ==============================================================
# Font
# ==============================================================

font_family JetBrains Mono Nerd Font
font_size 12.0


# ==============================================================
# Cursor
# ==============================================================

cursor_shape beam
cursor_trail 1

cursor_blink_interval 0.6
cursor_stop_blinking_after 15.0


# ==============================================================
# Window
#
# Hyprland already provides outer gaps.
# Kitty only needs comfortable internal padding.
# ==============================================================

window_margin_width 0
window_padding_width 12

confirm_os_window_close 0


# ==============================================================
# Shell
# ==============================================================

shell fish

shell_integration enabled


# ==============================================================
# Scrollback
# ==============================================================

scrollback_lines 20000

wheel_scroll_multiplier 3.0


# ==============================================================
# Bell
# ==============================================================

enable_audio_bell no

visual_bell_duration 0.0


# ==============================================================
# URLs
# ==============================================================

detect_urls yes

url_style curly

open_url_with default

show_hyperlink_targets yes


# ==============================================================
# Tabs
#
# Completely invisible when only one tab exists.
# ==============================================================








# ==============================================================
# Clipboard
# ==============================================================

map ctrl+c copy_or_interrupt
map ctrl+shift+v paste_from_clipboard


# ==============================================================
# Search current terminal output
# ==============================================================

map ctrl+f \
    launch --location=hsplit --allow-remote-control \
    kitty +kitten search.py @active-kitty-window-id

map kitty_mod+f \
    launch --location=hsplit --allow-remote-control \
    kitty +kitten search.py @active-kitty-window-id


# ==============================================================
# Panes
#
# Ctrl+Shift+Enter → new pane using current directory
# ==============================================================

map ctrl+shift+enter new_window_with_cwd

map ctrl+shift+w close_window


# --------------------------------------------------------------
# Move focus between panes
# --------------------------------------------------------------

map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right


# --------------------------------------------------------------
# Move panes
# --------------------------------------------------------------

map alt+shift+h move_window left
map alt+shift+j move_window down
map alt+shift+k move_window up
map alt+shift+l move_window right


# --------------------------------------------------------------
# Cycle layouts
# --------------------------------------------------------------

map ctrl+shift+l next_layout


# ==============================================================
# Tabs
# ==============================================================

map ctrl+shift+t new_tab_with_cwd

map ctrl+tab next_tab
map ctrl+shift+tab previous_tab


# ==============================================================
# Scroll
# ==============================================================

map page_up scroll_page_up
map page_down scroll_page_down

# >>> nyvorel-terminal-process-finish-notifications >>>
# Native Kitty command lifecycle notification.
# - always: notify even when Kitty is focused
# - 5.0: only commands lasting at least five seconds
# - notify: desktop notification through the active notification service
notify_on_cmd_finish always 5.0 notify
# <<< nyvorel-terminal-process-finish-notifications <<<

# >>> nyvorel-terminal-dynamic-glass >>>
# One source of truth: Nyvorel generated Material colors.
# nyvorel-dynamic-theme.conf is regenerated automatically when colors.json changes.
tab_bar_edge bottom
tab_bar_min_tabs 1
tab_bar_style custom
tab_bar_align left
tab_separator ""
tab_title_max_length 0
active_tab_font_style bold
inactive_tab_font_style normal
tab_bar_margin_width 0
tab_bar_margin_height 1 0

# Glass is Kitty background alpha + Hyprland's compositor blur.
dynamic_background_opacity yes

# Live theme updates from the per-user systemd watcher. Socket-only keeps
# terminal TTY remote control disabled while allowing local UNIX-socket reloads.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/nyvorel-kitty-{kitty_pid}

# Generated semantic system colors + glass opacity.
include nyvorel-dynamic-theme.conf

# terminal background behavior (managed)
# Opacity is owned by nyvorel-dynamic-theme.conf so live and startup states match.
background_blur 0
# <<< nyvorel-terminal-dynamic-glass <<<

# terminal tab bar palette override removed by terminal-bottom-bar-startup-v1.1
# nyvorel-dynamic-theme.conf above is now the single source of truth.
