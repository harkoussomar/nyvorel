name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyvorel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    name: Source integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate source contracts
        run: bash scripts/ci/validate-source.sh

      - name: Validate packaging ownership contract
        run: bash scripts/ci/test-packaging-ownership-contract.sh

      - name: Validate Arch package layout
        run: bash scripts/ci/test-package-layout.sh

      - name: Validate release candidate preflight
        run: bash scripts/ci/test-release-preflight.sh

      - name: Validate release publication engine
        run: bash scripts/ci/test-release-publication.sh

  installer-recovery:
    name: Installer & recovery sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Exercise install and recovery lifecycle
        run: bash scripts/ci/test-installer-sandbox.sh

  doctor:
    name: Doctor sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Exercise Nyvorel doctor
        run: bash scripts/ci/test-doctor.sh

  update:
    name: Update lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Exercise safe update lifecycle
        run: bash scripts/ci/test-update.sh

      - name: Exercise stable/development channel resolution
        run: bash scripts/ci/test-update-channels.sh

      - name: Exercise v0.1.0 to v0.1.1 upgrade matrix
        run: bash scripts/ci/test-upgrade-matrix.sh

  clean-machine:
    name: Clean-machine Arch install
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate pristine Arch installation lifecycle
        env:
          NYVOREL_CONTAINER_RUNTIME: docker
          NYVOREL_CLEAN_MACHINE_IMAGE: archlinux:base
        run: bash scripts/ci/test-clean-machine.sh

      - name: Validate pristine Arch upgrade/recovery matrix
        env:
          NYVOREL_CONTAINER_RUNTIME: docker
          NYVOREL_UPGRADE_MATRIX_IMAGE: archlinux:base
        run: bash scripts/ci/test-upgrade-matrix-clean-machine.sh

      - name: Validate pristine Arch package lifecycle
        env:
          NYVOREL_CONTAINER_RUNTIME: docker
          NYVOREL_PACKAGE_IMAGE: archlinux:base
        run: bash scripts/ci/test-package-lifecycle.sh

      - name: Validate AUR Git package candidate
        env:
          NYVOREL_CONTAINER_RUNTIME: docker
          NYVOREL_AUR_PACKAGE_IMAGE: archlinux:base
        run: bash scripts/ci/test-aur-git.sh

  bootstrap-plan:
    name: Bootstrap planning
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate read-only bootstrap planning on pristine Arch
        env:
          NYVOREL_CONTAINER_RUNTIME: docker
          NYVOREL_BOOTSTRAP_IMAGE: archlinux:base
        run: bash scripts/ci/test-bootstrap.sh

      - name: Validate Phase 5 dependency UX and compatibility
        run: bash scripts/ci/test-phase5-readiness.sh
