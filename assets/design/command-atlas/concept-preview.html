.v3{--pink:#efb6ae;--cyan:#dcc497;background:#211d1d}.v3 .window{background:#262321;border-color:#7c6960}.v3 .win-top{background:#292421}.v3 .brandmark{border-radius:50%;background:#f2d5bc}.v3 .view-tabs button.active{background:#e9c5b1}.v3 .manual{padding:28px 38px 32px;flex:1;min-height:0}.v3 .manual-title{display:flex;justify-content:space-between;align-items:end;gap:20px;padding-bottom:22px;border-bottom:1px solid #a2877755}.v3 .manual-title h2{font-size:37px;letter-spacing:-.055em;font-weight:500;margin:3px 0 5px}.v3 .manual-title p{font-size:12px;color:#c6bbb4;margin:0}.v3 .manual-title .search{width:350px;background:#211c1a}.v3 .manual-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:34px;height:calc(100% - 88px);min-height:0}.v3 .manual-index{padding:20px 0;border-right:1px solid #a2877745}.v3 .manual-index button{display:block;width:95%;font-size:12px;letter-spacing:.02em;padding:10px 11px;border:0;background:transparent;color:#cfc3bd;text-align:left;border-radius:5px}.v3 .manual-index button.active{background:#e7b3a622;color:#f1c9be}.v3 .manual-index button span{font:10px Consolas,monospace;color:#bc9d8c;margin-right:12px}.v3 .manual-entries{padding:20px 3px 10px 0}.v3 .manual-entries .section-head h2{font-size:19px}.v3 .manual-table{width:100%;border-collapse:collapse}.v3 .manual-table th{text-align:left;color:#a9988e;font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;padding:10px 12px;border-bottom:1px solid #a2877760}.v3 .manual-table td{padding:12px;border-bottom:1px solid #a2877737;font-size:12px}.v3 .manual-table tr:hover td{background:#e8bca50a}.v3 .manual-table td:first-child{font-weight:600;color:#e9ddd4}.v3 .manual-table td:nth-child(3){color:#c5b6ac}.v3 .manual-table .kbd{border-color:#c8a69688;background:#d09c8320;color:#edd6ca}.v3 .manual-footer{margin-top:20px;color:#a8978e;font-size:11px}.v3 .genome{padding:28px 38px 38px;flex:1;min-height:0}.v3 .genome h2{font-size:38px;font-weight:500;letter-spacing:-.05em;margin:4px 0}.v3 .genome p{font-size:12px;color:#c7bab1;margin:0 0 20px}.v3 .genome-scroll{height:calc(100% - 95px);overflow:auto}.v3 .genome-line{position:relative;display:grid;grid-template-columns:100px 1fr 220px;gap:24px;align-items:center;min-height:92px;border-top:1px solid #9c82735e}.v3 .genome-line:last-child{border-bottom:1px solid #9c82735e}.v3 .genome-no{font:14px Consolas,monospace;color:#edb4a9}.v3 .genome-main{display:flex;align-items:center;gap:18px}.v3 .genome-symbol{height:46px;width:46px;display:grid;place-items:center;border:1px solid #d6a99d;border-radius:50%;font:24px Georgia,serif;color:#edc8b5;flex:none}.v3 .genome-main strong{font-size:18px;font-weight:500}.v3 .genome-main small{display:block;color:#ae9d92;font-size:11px;margin-top:4px}.v3 .genome-tags{display:flex;flex-wrap:wrap;gap:5px}.v3 .genome-tags span{font:10px Consolas,monospace;color:#e5c5b6;border:1px solid #bd93815e;border-radius:4px;padding:5px 7px}.v3 .genome-identity{margin-top:17px;font-size:11px;color:#ad9990}

<body>
<div class="sample-switch"><div><strong>NYVOREL · DESIGN STUDY</strong><small>Shortcut reference and Elements replacement</small></div><div class="variant-tabs" role="tablist" aria-label="Design concepts"><button data-variant="1" class="active">01 · Command Atlas</button><button data-variant="2">02 · Keyspace</button><button data-variant="3">03 · Field Manual</button></div><div class="variant-caption" id="caption">Command Atlas + animated Nyvorel universe</div></div>
<main class="stage"><div class="window v1" id="window"></div></main>
<script>
const binds=[
{cat:'Shell',title:'Workspace overview',keys:['Super','Tab'],detail:'See all workspaces and open windows.'},
{cat:'Shell',title:'Search and launch',keys:['Super'],detail:'Open Nyvorel search with a tap.'},
{cat:'Shell',title:'Left sidebar',keys:['Super','A'],detail:'Open the left sidebar.'},
{cat:'Shell',title:'Right sidebar',keys:['Super','N'],detail:'Open controls and notifications.'},
{cat:'Shell',title:'Shortcut guide',keys:['Super','/'],detail:'Open this reference.'},
{cat:'Shell',title:'Media controls',keys:['Super','M'],detail:'Open playback controls.'},
{cat:'Shell',title:'Appearance Studio',keys:['Super','Alt','T'],detail:'Edit the desktop theme.'},
{cat:'Capture',title:'Capture a region',keys:['Super','Shift','S'],detail:'Select a region to screenshot.'},
{cat:'Capture',title:'Search what you see',keys:['Super','Shift','A'],detail:'Select a region for visual search.'},
{cat:'Capture',title:'Copy text from screen',keys:['Super','Shift','X'],detail:'Run OCR on a selected region.'},
{cat:'Capture',title:'Pick a color',keys:['Super','Shift','C'],detail:'Copy an on-screen color.'},
{cat:'Windows',title:'Close active window',keys:['Super','Q'],detail:'Close the focused window.'},
{cat:'Windows',title:'Move window left',keys:['Super','Shift','←'],detail:'Move focused window in the layout.'},
{cat:'Windows',title:'Move to left display',keys:['Super','Shift','Alt','←'],detail:'Send active window to the left monitor.'},
{cat:'Windows',title:'Toggle floating',keys:['Super','Alt','Space'],detail:'Switch between tiled and floating.'},
{cat:'Workspaces',title:'Go to workspace 1',keys:['Super','1'],detail:'Switch to workspace 1.'},
{cat:'Workspaces',title:'Move window to workspace 1',keys:['Super','Shift','1'],detail:'Send the focused window to workspace 1.'},
{cat:'System',title:'Lock screen',keys:['Super','L'],detail:'Lock this session.'},
{cat:'System',title:'Backup & Recovery',keys:['Super','U'],detail:'Open recovery tools.'},
{cat:'System',title:'Arch Remote',keys:['Super','Y'],detail:'Open remote access controls.'},
{cat:'System',title:'Mute audio',keys:['Super','Shift','M'],detail:'Toggle speaker mute.'},
];
const cats=['All','Shell','Windows','Workspaces','Capture','System'];
let variant=1,view='keys',category='All',query='';
const captions={1:'Command Atlas + animated Nyvorel universe',2:'Keyboard-first discovery + signal circuit',3:'Editorial reference + Nyvorel system genome'};
const keycap=keys=>keys.map(k=>`<span class="kbd">${k}</span>`).join('<span class="fine"> + </span>');
const row=b=>`<div class="bind-row" title="${b.detail}"><b>${b.title}</b><div>${keycap(b.keys)}</div></div>`;
function matches(b){return(category==='All'||b.cat===category)&&(`${b.title} ${b.detail} ${b.cat} ${b.keys.join(' ')}`).toLowerCase().includes(query.toLowerCase())}
const visible=()=>binds.filter(matches);
function nav(){return `<header class="win-top"><div class="brand"><div class="brandmark" aria-hidden="true"><img src="source/moon-logo.svg" alt=""></div><div><h1>Nyvorel</h1><div class="eyebrow">Control reference</div></div></div><div class="view-tabs" role="tablist"><button data-view="keys" class="${view==='keys'?'active':''}">⌨ &nbsp; Keybindings</button><button data-view="map" class="${view==='map'?'active':''}">${variant===1?'◎ &nbsp; Universe':variant===2?'⌁ &nbsp; Signal map':'✦ &nbsp; System genome'}</button></div><button class="win-close" title="Preview window" aria-label="Preview window">×</button></header>`}
function v1keys(){let arr=visible();let groups=[...new Set(arr.map(b=>b.cat))];return `<div class="atlas-grid"><aside class="atlas-nav"><div class="eyebrow">Categories</div>${cats.map(c=>`<button class="filter-button ${category===c?'active':''}" data-cat="${c}">${c}<span class="count">${c==='All'?binds.length:binds.filter(b=>b.cat===c).length}</span></button>`).join('')}</aside><section class="atlas-main scroll"><div class="atlas-intro"><div><div class="eyebrow">Command Atlas</div><h2 style="font-size:28px;font-weight:600;letter-spacing:-.04em;margin:7px 0">Shortcuts</h2></div><label class="search"><span>⌕</span><input id="search" placeholder="Action or key…" value="${query.replace(/"/g,'&quot;')}"></label></div>${groups.map(c=>`<div class="group-label">${c} · ${arr.filter(b=>b.cat===c).length}</div><div class="atlas-list">${arr.filter(b=>b.cat===c).map(row).join('')}</div>`).join('')||'<div class="empty">No matching shortcuts.</div>'}</section><aside class="atlas-inspector"><div class="eyebrow">Essentials</div><div class="essential"><span>Search</span>${keycap(['Super'])}</div><div class="essential"><span>Overview</span>${keycap(['Super','Tab'])}</div><div class="essential"><span>Controls</span>${keycap(['Super','N'])}</div><div class="essential"><span>This guide</span>${keycap(['Super','/'])}</div></aside></div>`}
const universePlanets=[['Mercury','mercury','01'],['Venus','venus','02'],['Earth','earth','03'],['Mars','mars','04'],['Jupiter','jupiter','05'],['Saturn','saturn','06'],['Uranus','uranus','07'],['Neptune','neptune','08']];
function planet(name,slug,number,position){return `<button class="planet ${slug} ${position}" type="button" title="${name}" aria-label="${name}" data-planet="${slug}"><span class="planet-visual"><img src="../../../quickshell/assets/planets/${slug}.png" alt=""><span class="planet-label">${name}</span></span></button>`}
function v1map(){return `<div class="universe-page"><div class="universe-meta"><span>NYVOREL UNIVERSE</span><span>08 PLANETS</span></div><div class="universe" role="group" aria-label="Animated Nyvorel universe with eight planets"><div class="stars stars-one"></div><div class="stars stars-two"></div><div class="universe-orbit orbit-inner">${planet('Mercury','mercury','01','at-top')}${planet('Venus','venus','02','at-bottom')}</div><div class="universe-orbit orbit-middle">${planet('Earth','earth','03','at-top')}${planet('Mars','mars','04','at-bottom')}</div><div class="universe-orbit orbit-giants">${planet('Jupiter','jupiter','05','at-top')}${planet('Saturn','saturn','06','at-bottom')}</div><div class="universe-orbit orbit-outer">${planet('Uranus','uranus','07','at-top')}${planet('Neptune','neptune','08','at-bottom')}</div><div class="universe-halo"></div><div class="universe-core"><img src="../../../quickshell/assets/planets/nyvorel-moon-3d.png" alt="Realistic Nyvorel moon"></div><div class="universe-bottom"><span id="elementReadout">SELECT A PLANET</span><button type="button" id="motionToggle" aria-pressed="false">Ⅱ &nbsp; Pause motion</button></div></div></div>`}
const keyboardRows=[['Esc','1','2','3','4','5','6','7','8','9','0','-','='],['Tab','Q','W','E','R','T','Y','U','I','O','P','[',']'],['Caps','A','S','D','F','G','H','J','K','L',';','Enter'],['Shift','Z','X','C','V','B','N','M',',','.','/','Shift'],['Ctrl','Super','Alt','Space','Alt','Super','Menu','Ctrl']];
function v2keys(){let arr=visible();return `<div class="keyspace scroll"><div class="keyspace-head"><div><div class="eyebrow">Shortcut discovery / keyspace</div><h2>Learn by touch.</h2><p>Tap a highlighted key or search for an action.</p></div><label class="search"><span>⌕</span><input id="search" placeholder="Search actions or keys…" value="${query.replace(/"/g,'&quot;')}"></label></div><div class="keyboard" aria-label="Interactive keyboard preview"><div class="keyboard-top"><span>HOLD SUPER TO EXPLORE</span><span>NYVOREL / KEYSPACE</span></div>${keyboardRows.map(r=>`<div class="keyrow">${r.map(k=>`<button class="keycap ${['A','N','Tab','M','Q','S','V','U','Y','Super','Space','1','/'].includes(k)?'hot':''} ${k==='Space'?'space':''} ${['Shift','Tab','Caps','Enter'].includes(k)?'wide':''}" data-key="${k}" title="Filter shortcuts using ${k}">${k}</button>`).join('')}</div>`).join('')}</div><div class="keyspace-bottom"><div><div class="filter-strip">${cats.map(c=>`<button class="${category===c?'active':''}" data-cat="${c}">${c}</button>`).join('')}</div><div class="recipe-list">${arr.slice(0,12).map(b=>`<div class="recipe"><div><b>${b.title}</b><small>${b.cat}</small></div><div>${keycap(b.keys)}</div></div>`).join('')||'<div class="empty">No shortcuts match.</div>'}</div></div><aside class="keyspace-aside"><div class="eyebrow">How it works</div><h3>One key, many actions.</h3><p>Hold Super, then choose a highlighted key. Search works by both action and key name.</p><div class="inspector-rule"></div><div class="pill"><b>Tip</b> Try Tab, N or M</div></aside></div></div>`}
function v2map(){return `<div class="signal-map"><div class="signal-main"><div class="eyebrow">Nyvorel system / 02</div><h2>Signal map</h2><p>Inputs become actions, then change the desktop.</p><div class="signal-stage"><div class="signal-track t1"></div><div class="signal-track t2"></div><div class="signal-track t3"></div><div class="signal-track t4"></div><div class="signal-node core"><strong>NYVOREL</strong><small>action bus</small></div><div class="signal-node a"><strong>Keys</strong><small>input</small></div><div class="signal-node b"><strong>Shell</strong><small>surface</small></div><div class="signal-node c"><strong>Services</strong><small>state</small></div><div class="signal-node d"><strong>Recovery</strong><small>control</small></div></div></div><aside class="signal-aside"><div class="eyebrow">Signal / 001</div><h3>Every action has a path</h3><p>Keyboard and pointer events enter Nyvorel. The shell routes them to interfaces, services or recovery tools.</p><div class="signal-stat">Keys → action → response</div><p>This replaces the chemistry table with a map of the desktop you actually use.</p></aside></div>`}
function v3keys(){let arr=visible();return `<div class="manual"><div class="manual-title"><div><div class="eyebrow">Reference / 01</div><h2>The field manual.</h2><p>Plain language for every action. Organized for scanning.</p></div><label class="search"><span>⌕</span><input id="search" placeholder="Find action, category or key…" value="${query.replace(/"/g,'&quot;')}"></label></div><div class="manual-layout"><aside class="manual-index"><div class="eyebrow" style="margin-bottom:13px">Contents</div>${cats.map((c,i)=>`<button data-cat="${c}" class="${category===c?'active':''}"><span>${String(i+1).padStart(2,'0')}</span>${c==='All'?'All actions':c}</button>`).join('')}</aside><section class="manual-entries scroll"><div class="section-head"><h2>${category==='All'?'Everyday controls':category}</h2><small>${arr.length} shortcuts</small></div><table class="manual-table"><thead><tr><th style="width:38%">Action</th><th style="width:32%">Keys</th><th>What happens</th></tr></thead><tbody>${arr.map(b=>`<tr><td>${b.title}</td><td>${keycap(b.keys)}</td><td>${b.detail}</td></tr>`).join('')}</tbody></table>${arr.length?'':'<div class="empty">No matches.</div>'}<div class="manual-footer">Nyvorel / shortcuts are read from the current Hyprland configuration in the final implementation.</div></section></div></div>`}
function v3map(){const systems=[['01','⌘','Control','Keyboard, pointer and launcher','Super / Tab / Slash'],['02','□','Space','Workspaces and window arrangement','Overview / Move / Focus'],['03','◌','Surface','Bar, sidebars and settings','Bar / Panels / Theme'],['04','♪','Flow','Media, audio and notifications','Player / Sound / Alerts'],['05','↺','Continuity','Backup, recovery and remote access','Backup / Restore / Remote']];return `<div class="genome"><div class="eyebrow">Nyvorel / 02 / identity</div><h2>System genome.</h2><p>The five ideas that make this desktop feel like one system.</p><div class="genome-scroll">${systems.map(s=>`<div class="genome-line"><div class="genome-no">${s[0]} / 05</div><div class="genome-main"><div class="genome-symbol">${s[1]}</div><div><strong>${s[2]}</strong><small>${s[3]}</small></div></div><div class="genome-tags">${s[4].split(' / ').map(t=>`<span>${t}</span>`).join('')}</div></div>`).join('')}<div class="genome-identity">NYVOREL IS A DESKTOP LANGUAGE. THESE ARE ITS PRIMARY ELEMENTS.</div></div></div>`}
let orbitFrame=0;
function startUniverseMotion(){
  cancelAnimationFrame(orbitFrame);
  const stage=document.querySelector('.universe');
  if(!stage)return;
  const rings=[...stage.querySelectorAll('.universe-orbit')];
  const initial=[-.65,3.75,1.75,3.22];
  const seconds=[42,63,85,112],direction=[1,-1,1,-1];
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  let last=performance.now(),elapsed=0;
  function place(){
    rings.forEach((ring,i)=>{
      const box=ring.getBoundingClientRect(),rx=box.width/2,ry=box.height/2;
      ring.querySelectorAll('.planet').forEach((body,j)=>{
        const angle=initial[i]+j*Math.PI+(reduced.matches?0:direction[i]*elapsed/1000*2*Math.PI/seconds[i]);
        body.style.transform=`translate(-50%,-50%) translate(${(rx*Math.cos(angle)).toFixed(1)}px, ${(ry*Math.sin(angle)).toFixed(1)}px)`;
      });
    });
  }
  function frame(now){
    if(!document.querySelector('.universe')||variant!==1||view!=='map'||document.hidden){orbitFrame=0;return}
    const dt=Math.min(64,now-last);last=now;
    if(!stage.classList.contains('motion-paused')&&!stage.querySelector('.planet:hover'))elapsed+=dt;
    place();orbitFrame=requestAnimationFrame(frame);
  }
  place();
  if(!reduced.matches)orbitFrame=requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&variant===1&&view==='map'&&!orbitFrame)startUniverseMotion()});
window.addEventListener('resize',()=>{if(variant===1&&view==='map')startUniverseMotion()});
function render(keepFocus=false){cancelAnimationFrame(orbitFrame);orbitFrame=0;const focus=keepFocus&&document.activeElement?.id==='search';const pos=focus?document.activeElement.selectionStart:0;const win=document.getElementById('window');win.className=`window v${variant}`;win.innerHTML=nav()+(view==='keys'?[v1keys,v2keys,v3keys][variant-1]():[v1map,v2map,v3map][variant-1]());document.getElementById('caption').textContent=captions[variant];document.querySelectorAll('[data-variant]').forEach(b=>b.classList.toggle('active',Number(b.dataset.variant)===variant));if(focus){const s=document.getElementById('search');s.focus();s.setSelectionRange(pos,pos)}if(variant===1&&view==='map')startUniverseMotion()}
document.addEventListener('click',e=>{const motion=e.target.closest('#motionToggle'),planet=e.target.closest('[data-planet]');if(motion){const universe=document.querySelector('.universe');const paused=universe.classList.toggle('motion-paused');motion.setAttribute('aria-pressed',String(paused));motion.textContent=paused?'▶  Resume motion':'Ⅱ  Pause motion';return}if(planet){const item=universePlanets.find(x=>x[1]===planet.dataset.planet);document.getElementById('elementReadout').textContent=item?item[0].toUpperCase():'SELECT A PLANET';return}const v=e.target.closest('[data-variant]'),w=e.target.closest('[data-view]'),c=e.target.closest('[data-cat]'),k=e.target.closest('[data-key]');if(v){variant=Number(v.dataset.variant);category='All';query='';view='keys';render()}else if(w){view=w.dataset.view;render()}else if(c){category=c.dataset.cat;render()}else if(k){category='All';query=k.dataset.key==='Super'?'Super':k.dataset.key;render();document.getElementById('search')?.focus()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;render(true)}});
const params=new URLSearchParams(location.search);const selected=Number(params.get('concept'));if([1,2,3].includes(selected))variant=selected;if(params.get('view')==='map')view='map';render();
