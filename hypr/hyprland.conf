# This file sources other files in `hyprland` and `custom` folders
# You wanna add your stuff in files in `custom`

$qsConfig = nyvorel
exec = hyprctl dispatch submap global # DO NOT REMOVE THIS OR YOU WON'T BE ABLE TO USE ANY KEYBIND
submap = global # This is required for catchall to work

# Environment variables
source=hyprland/env.conf
source=custom/env.conf

# Defaults
source=hyprland/execs.conf
source=hyprland/general.conf
source=hyprland/rules.conf
source=hyprland/colors.conf
source=hyprland/keybinds.conf

# Custom 
source=custom/execs.conf
source=custom/general.conf
source=custom/rules.conf
source=custom/keybinds.conf
source=custom/nyvorel-super-scroll.conf

# nwg-displays support
source=workspaces.conf
source=monitors.conf
env = _JAVA_AWT_WM_NONREPARENTING,1

# HyprMod managed settings
source = @HOME@/.config/hypr/hyprland-gui.conf

# >>> nyvorel-terminal-glass >>>
source = ~/.config/hypr/nyvorel-terminal-glass.conf
# <<< nyvorel-terminal-glass <<<


# nyvorel-project-launcher-real-backdrop-v1 BEGIN
# Keep this after the general layer rules so it overrides global xray=on.
# xray off makes Project Launcher use the actual window directly behind it.
layerrule = match:namespace quickshell:projectLauncher, xray off
# nyvorel-project-launcher-real-backdrop-v1 END

# nyvorel-sidebar-real-backdrop-v1 BEGIN
# Keep these final overrides after sourced Fluid rules.
# xray off makes the attached sidebars blur/composite the actual application
# window directly behind them instead of skipping it and sampling wallpaper.
layerrule = match:namespace ^quickshell:sidebarLeft$, xray off
layerrule = match:namespace ^quickshell:sidebarRight$, xray off
# nyvorel-sidebar-real-backdrop-v1 END

# nyvorel-translucent-real-backdrop-v1 BEGIN
# Final real-backdrop overrides for floating/transient Quickshell surfaces.
# Keep after Fluid xray-on rules so the actual application/window directly
# behind each surface is used as the blur/transparency backdrop.
#
# quickshell:popup covers:
#   - resource usage dialog
#   - battery dialog
#   - agenda/calendar dialog
layerrule = match:namespace ^quickshell:popup$, xray off

# Other audited translucent surfaces:
layerrule = match:namespace ^quickshell:notificationPopup$, xray off
layerrule = match:namespace ^quickshell:mediaControls$, xray off
layerrule = match:namespace ^quickshell:onScreenDisplay$, xray off
layerrule = match:namespace ^quickshell:appearanceStudio$, xray off
# nyvorel-translucent-real-backdrop-v1 END

# nyvorel-session-kitty-fluid-background-v1 BEGIN
# Session uses the actual application/window underneath, matching Kitty's
# non-xray blur path instead of skipping normal windows to the wallpaper.
layerrule = match:namespace ^quickshell:session$, xray off
# nyvorel-session-kitty-fluid-background-v1 END

# nyvorel-zed-system-theme-v1 BEGIN
# Zed owns its alpha through theme colors. Hyprland supplies the same background
# blur used by the Fluid terminal when those colors are transparent.
windowrule = match:class ^(dev\.zed\.Zed)$, no_blur off
# nyvorel-zed-system-theme-v1 END

# nyvorel-dolphin-system-theme-v1 BEGIN
# Darkly owns Dolphin surface alpha; Hyprland supplies compositor blur behind it.
# This final rule overrides the base "no_blur on" rule for normal windows.
windowrule = match:class ^(org\.kde\.dolphin|dolphin)$, no_blur off
# nyvorel-dolphin-system-theme-v1 END

# nyvorel-motion-phase3c-ownership-v1 BEGIN
# QML owns the presentation choreography for these surfaces. Prevent the
# compositor's generic layer animation from stacking on top when an opaque
# profile maps/unmaps the native layer.
layerrule = match:namespace ^quickshell:(archRemote|backupRecovery|mediaControls|onScreenDisplay)$, no_anim on

# Backup & Recovery and Arch Remote are full-screen modal hosts. Match the
# rest of the real-backdrop glass system: composite the actual app/window
# underneath instead of xray-skipping it to the wallpaper.
layerrule = match:namespace ^quickshell:(archRemote|backupRecovery)$, xray off
# nyvorel-motion-phase3c-ownership-v1 END

# >>> nyvorel-notification-popup-opacity-stability-v1 >>>
# NotificationToastList.qml owns per-toast motion. Do not stack Hyprland's
# layer fade on top of QML transitions.
layerrule = match:namespace ^quickshell:notificationPopup$, no_anim on

# Keep the notification on the real application backdrop and override the
# broader Fluid xray/alpha rules with the same shaped-glass threshold used by
# the current runtime glass system.
layerrule = match:namespace ^quickshell:notificationPopup$, blur on
layerrule = match:namespace ^quickshell:notificationPopup$, blur_popups on
layerrule = match:namespace ^quickshell:notificationPopup$, xray off
layerrule = match:namespace ^quickshell:notificationPopup$, ignore_alpha 0.12
# <<< nyvorel-notification-popup-opacity-stability-v1 <<<

# >>> nyvorel-qt-utility-windows-v1 >>>
# Qt audio settings now follows the same platform theme/KDE palette as Dolphin.
# Keep only window geometry here; the application style remains owned by KDE.
windowrule = match:class ^(pavucontrol-qt)$, float on
windowrule = match:class ^(pavucontrol-qt)$, size (monitor_w*.45) (monitor_h*.45)
windowrule = match:class ^(pavucontrol-qt)$, center on
# <<< nyvorel-qt-utility-windows-v1 <<<
