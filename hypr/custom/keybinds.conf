# See https://wiki.hyprland.org/Configuring/Binds/
#!

# ============================================================
# User
# ============================================================

##! User

bind = Ctrl+Super, comma, exec, xdg-open ~/.config/nyvorel/config.json # Open shell configuration
bind = Ctrl+Super, period, exec, kitty -1 nano ~/.config/hypr/custom/keybinds.conf # Edit custom keybinds


# ============================================================
# Apps
# ============================================================

##! Apps

# bind = Super, Return, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "${TERMINAL}" "kitty -1" "foot" "alacritty" "wezterm" "konsole" "kgx" "uxterm" "xterm" # Terminal
# bind = Super, T, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "${TERMINAL}" "kitty -1" "foot" "alacritty" "wezterm" "konsole" "kgx" "uxterm" "xterm" # Terminal alt
# bind = Ctrl+Alt, T, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "${TERMINAL}" "kitty -1" "foot" "alacritty" "wezterm" "konsole" "kgx" "uxterm" "xterm"
# bind = Super, E, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "dolphin" "nautilus" "nemo" "thunar"
# bind = Super, W, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "google-chrome-stable" "zen-browser" "firefox" "brave" "chromium"
# bind = Super, C, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "antigravity" "code" "codium" "cursor" "zed"


# ============================================================
# Replace upstream binds
# ============================================================

# Nyvorel's default config is loaded before this file.
# Remove only the bindings that we intentionally replace here.

# Default split-ratio keys
unbind = Super, Semicolon
unbind = Super, Apostrophe

# Default lock shortcut
unbind = Super, L

# Default zoom keys
unbind = Super, Minus
unbind = Super, Equal


# ============================================================
# Window management
# ============================================================

##! Window management

# ------------------------------------------------------------
# Split ratio
# ------------------------------------------------------------
#
# Italian keyboard-friendly keys.
#
# These affect the current Dwindle split rather than resizing
# a floating window directly.

binde = Super, apostrophe, layoutmsg, splitratio -0.1 # Decrease split ratio
binde = Super, igrave, layoutmsg, splitratio +0.1 # Increase split ratio


# ------------------------------------------------------------
# Directional resize
# ------------------------------------------------------------
#
# Mental model:
#
# Super         + Arrow = focus
# Super + Shift + Arrow = move
# Super + Alt   + Arrow = resize
#
# Repeatable so the key can be held for continuous resizing.

binde = Super+Alt, Left, resizeactive, -20 0 # Resize left
binde = Super+Alt, Right, resizeactive, 20 0 # Resize right
binde = Super+Alt, Up, resizeactive, 0 -20 # Resize up
binde = Super+Alt, Down, resizeactive, 0 20 # Resize down


# ============================================================
# Shell
# ============================================================

##! Shell

# Extra cheatsheet shortcut for the Italian keyboard.
bindd = Super, backslash, Toggle cheatsheet, global, quickshell:cheatsheetToggle # Shortcut cheatsheet (alternate key)


# ============================================================
# Lock
# ============================================================

##! Session

# Use the Quickshell lock implementation directly.
# The upstream Super+L binding was removed above.

bindd = Super, L, Lock, global, quickshell:lock # Lock screen


# ============================================================
# Zoom
# ============================================================

##! Screen

# Italian keyboard-friendly zoom controls.
#
# Super + comma = zoom in
# Super + minus = zoom out

binde = Super, comma, exec, ~/.config/hypr/hyprland/scripts/zoom.sh increase 0.3 # Zoom in
binde = Super, minus, exec, ~/.config/hypr/hyprland/scripts/zoom.sh decrease 0.3 # Zoom out


# ============================================================
# Multitasking
# ============================================================

##! Multitasking

# Fast switching between windows on the current workspace.
#
# Alt + Tab         = next window
# Alt + Shift + Tab = previous window
#
# Keep Super + Tab for the full Quickshell workspace overview.

bind = Alt, Tab, cyclenext, # Next window
bind = Alt, Tab, alterzorder, top # [hidden] Alt-Tab implementation helper

bind = Alt+Shift, Tab, cyclenext, prev # Previous window
bind = Alt+Shift, Tab, alterzorder, top # [hidden] Alt-Tab implementation helper


# ============================================================
# Workspace cleanup
# ============================================================

# Keep the simple workspace model:
#
# Super + 1..0                     -> direct workspace
# Ctrl + Super + Left/Right        -> previous/next workspace
# Ctrl + Super + Shift + Left/Right -> move window + follow
# Super + Alt + 1..0               -> send silently
# Super + Tab                      -> overview
# Super + S                        -> scratchpad


# ------------------------------------------------------------
# Remove Page Up / Page Down workspace navigation
# ------------------------------------------------------------

unbind = Super, Page_Down
unbind = Super, Page_Up

unbind = Ctrl+Super, Page_Down
unbind = Ctrl+Super, Page_Up

unbind = Super+Alt, Page_Down
unbind = Super+Alt, Page_Up

unbind = Super+Shift, Page_Down
unbind = Super+Shift, Page_Up


# ------------------------------------------------------------
# Remove workspace switching with mouse wheel
# ------------------------------------------------------------

unbind = Super, mouse_up
unbind = Super, mouse_down

unbind = Ctrl+Super, mouse_up
unbind = Ctrl+Super, mouse_down

unbind = Super+Shift, mouse_up
unbind = Super+Shift, mouse_down

unbind = Super+Alt, mouse_up
unbind = Super+Alt, mouse_down


# ------------------------------------------------------------
# Remove secondary workspace-navigation aliases
# ------------------------------------------------------------

unbind = Ctrl+Super, BracketLeft
unbind = Ctrl+Super, BracketRight

unbind = Ctrl+Super, Up
unbind = Ctrl+Super, Down

unbind = Ctrl+Super+Alt, Left
unbind = Ctrl+Super+Alt, Right
# ASUS FNLOCK ACTIONS START

##! Hardware

# F8 - display configuration
bind = , XF86Display, exec, sh -lc 'command -v wdisplays >/dev/null && exec wdisplays; command -v nwg-displays >/dev/null && exec nwg-displays; command -v kcmshell6 >/dev/null && exec kcmshell6 kcm_kscreen; command -v systemsettings >/dev/null && exec systemsettings kcm_kscreen; notify-send "Display" "No graphical display configuration tool found"' # Display settings

# F10 - toggle EasyEffects processing
bindl = , F13, exec, sh -lc 'easyeffects --bypass-toggle || easyeffects' # Toggle EasyEffects processing

# F11 - custom 1: region screenshot
bind = , F21, global, quickshell:regionScreenshot # Region screenshot

# F12 - custom 2: workspace overview
bind = , F22, global, quickshell:overviewWorkspacesToggle # Workspace overview

# ASUS FNLOCK ACTIONS END

# >>> nyvorel-project-launcher-native >>>
# Native Nyvorel Project Command Center
unbind = Super, P
unbind = Super+Alt, P

##! Projects
bindd = Super, P, Projects, global, quickshell:projectsToggle # Project command center

##! Window management
bind = Super+Alt, P, pin # Pin window to all workspaces
# <<< nyvorel-project-launcher-native <<<

# >>> nyvorel-appearance-studio >>>
##! Appearance
bindd = Super+Alt, T, Appearance Studio, global, quickshell:appearanceStudioToggle # Theme and UI manager
# <<< nyvorel-appearance-studio <<<
# >>> arch-remote-control-center >>>
# Super+Y — Arch Remote Control Center
bind = SUPER, Y, exec, /usr/bin/qs -c nyvorel ipc call archRemote toggle
# <<< arch-remote-control-center <<<
# >>> backup-recovery-center >>>
# Super+U — Backup & Recovery Center
bind = SUPER, U, exec, /usr/bin/qs -c nyvorel ipc call backupRecovery toggle
# <<< backup-recovery-center <<<
