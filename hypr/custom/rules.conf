# You can put custom rules here
# Window/layer rules: https://wiki.hyprland.org/Configuring/Window-Rules/
# Workspace rules: https://wiki.hyprland.org/Configuring/Workspace-Rules/

# ######## Window rules ########

# Uncomment to apply global transparency to all windows:
# windowrule = opacity 0.89 override 0.89 override, match:class .*

# Disable blur for all xwayland apps
# windowrule = no_blur on, match:xwayland 1

windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, pin on

# >>> project-command-center-layer >>>
# Project Center owns its visual presentation.
# Override the generic Quickshell blur/pop-in rules.
layerrule = match:namespace ^quickshell:projectLauncher$, no_anim on
layerrule = match:namespace ^quickshell:projectLauncher$, blur off
layerrule = match:namespace ^quickshell:projectLauncher$, blur_popups off
layerrule = match:namespace ^quickshell:projectLauncher$, dim_around off
# <<< project-command-center-layer <<<

# >>> appearance-studio-settings-window-animation >>>
# Appearance Studio owns its Settings-style 80%/90% pop animation in QML.
# Disable only the compositor animation for this exact layer to avoid doubling.
layerrule = match:namespace ^quickshell:appearanceStudio$, no_anim on
# <<< appearance-studio-settings-window-animation <<<

# >>> appearance-studio-glass-runtime-v2 >>>
# Runtime-only Glass overrides. Default removes this entire block.
#
# Every visible Quickshell material surface is alpha-shaped in QML. Hyprland
# must therefore blur only pixels that belong to the rendered surface, never
# the rectangular native/layer-shell backing buffer around it.
layerrule = match:namespace ^quickshell:.*$, blur on
layerrule = match:namespace ^quickshell:.*$, blur_popups on
layerrule = match:namespace ^quickshell:.*$, xray off
layerrule = match:namespace ^quickshell:.*$, ignore_alpha 0.12

# Explicit material surfaces use the same mask threshold. Keeping one policy
# avoids special-case rectangles around popups, launchers, OSDs and media HUDs.
layerrule = match:namespace ^quickshell:popup$, ignore_alpha 0.12
layerrule = match:namespace ^quickshell:mediaControls$, ignore_alpha 0.12
layerrule = match:namespace ^quickshell:onScreenDisplay$, ignore_alpha 0.12
layerrule = match:namespace ^quickshell:wOnScreenDisplay$, ignore_alpha 0.12
layerrule = match:namespace ^quickshell:projectLauncher$, blur on
layerrule = match:namespace ^quickshell:projectLauncher$, blur_popups on
layerrule = match:namespace ^quickshell:projectLauncher$, xray off
layerrule = match:namespace ^quickshell:projectLauncher$, ignore_alpha 0.12

# Utility/full-screen helper layers are not material panels. The generic rule
# above intentionally excludes them here so Glass never creates a screen-sized
# or invisible blur sheet.
layerrule = match:namespace ^quickshell:background$, blur off
layerrule = match:namespace ^quickshell:screenCorners$, blur off
layerrule = match:namespace ^quickshell:regionSelector$, blur off
layerrule = match:namespace ^quickshell:screenshot$, blur off
layerrule = match:namespace ^quickshell:overlay$, blur off
layerrule = match:namespace ^quickshell:lockWindowPusher$, blur off
layerrule = match:namespace ^quickshell$, blur off

# Settings is a normal Wayland window rather than a layer-shell surface. Blur is
# enabled here; the global ignore_opacity switch applied by this helper makes
# Hyprland respect the transparent pixels around its rounded QML modal.
windowrule = match:title ^(Nyvorel Settings)$, no_blur off
windowrule = match:title ^(Nyvorel Settings)$, xray off
windowrule = match:title ^(Nyvorel Settings)$, rounding 23
# >>> realistic-glass-optics-v3 >>>
# Realistic Glass v3.2 — Hyprland 0.56-compatible optical material.
# GLASS_BLOCK is a Python f-string, so literal Hyprland braces are doubled here.
decoration {
    blur {
        enabled = true
        size = 14
        passes = 3
        ignore_opacity = true
        new_optimizations = true
        xray = false
        noise = 0.018
        contrast = 0.93
        brightness = 1.06
        vibrancy = 0.12
        vibrancy_darkness = 0.04
        popups = true
        popups_ignorealpha = 0.08
    }
}
# <<< realistic-glass-optics-v3 <<<

# <<< appearance-studio-glass-runtime-v2 <<<

# >>> nyvorel-fluid-interface-v1 >>>
# Fluid: Caelestia-style transparent/xray layer material.
layerrule = match:namespace ^quickshell:(bar|verticalBar|sidebarLeft|sidebarRight|appearanceStudio|projectLauncher|popup|notificationPopup|mediaControls|onScreenDisplay|session)$, blur on
layerrule = match:namespace ^quickshell:(bar|verticalBar|sidebarLeft|sidebarRight|appearanceStudio|projectLauncher|popup|notificationPopup|mediaControls|onScreenDisplay|session)$, blur_popups on
layerrule = match:namespace ^quickshell:(bar|verticalBar|sidebarLeft|sidebarRight|appearanceStudio|projectLauncher|popup|notificationPopup|mediaControls|onScreenDisplay|session)$, xray on
layerrule = match:namespace ^quickshell:(bar|verticalBar|sidebarLeft|sidebarRight|appearanceStudio|projectLauncher|popup|notificationPopup|mediaControls|onScreenDisplay|session)$, ignore_alpha 0.57

# Reference-terminal geometry.
windowrule = match:class ^(kitty)$, border_size 2
windowrule = match:class ^(kitty)$, rounding 8
# <<< nyvorel-fluid-interface-v1 <<<
