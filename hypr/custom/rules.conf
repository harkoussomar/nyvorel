# You can put custom rules here
# Window/layer rules: https://wiki.hyprland.org/Configuring/Window-Rules/
# Workspace rules: https://wiki.hyprland.org/Configuring/Workspace-Rules/

# ######## Window rules ########

# Uncomment to apply global transparency to all windows:
# windowrule = opacity 0.89 override 0.89 override, match:class .*

# Disable blur for all xwayland apps
# windowrule = no_blur on, match:xwayland 1

windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, pin on

# >>> project-command-center-layer >>>
# Project Center owns its visual presentation.
# Override the generic Quickshell blur/pop-in rules.
layerrule = match:namespace ^quickshell:projectLauncher$, no_anim on
layerrule = match:namespace ^quickshell:projectLauncher$, blur off
layerrule = match:namespace ^quickshell:projectLauncher$, blur_popups off
layerrule = match:namespace ^quickshell:projectLauncher$, dim_around off
# <<< project-command-center-layer <<<

# >>> appearance-studio-settings-window-animation >>>
# Appearance Studio owns its Settings-style 80%/90% pop animation in QML.
# Disable only the compositor animation for this exact layer to avoid doubling.
layerrule = match:namespace ^quickshell:appearanceStudio$, no_anim on
# <<< appearance-studio-settings-window-animation <<<
