# ============================================================
# Super tap + hold fast scroll
# Managed integration; behavior/tuning lives in nyvorel-super-scroll.env.
#
# Ownership:
#   - hyprland/general.conf owns NORMAL scroll values.
#   - nyvorel-super-scroll owns Super tap/hold state and TEMPORARY fast values.
#   - Quickshell owns Search/Overview UI.
#
# This file is sourced AFTER custom/keybinds.conf on purpose.
# ============================================================

# A config reload reapplies persistent normal input values. Clear transient
# Super/fast-scroll state afterward so runtime state can never survive a reload.
exec = @HOME@/.local/bin/nyvorel-super-scroll reload-reset

# Physical Super lifecycle.
bindid = Super, Super_L, Toggle search on tap, exec, @HOME@/.local/bin/nyvorel-super-scroll press left
bindid = Super, Super_R, Toggle search on tap, exec, @HOME@/.local/bin/nyvorel-super-scroll press right
bindrtid = Super, Super_L, Toggle search on tap, exec, @HOME@/.local/bin/nyvorel-super-scroll release left
bindrtid = Super, Super_R, Toggle search on tap, exec, @HOME@/.local/bin/nyvorel-super-scroll release right

# Any other keyboard activity cancels tap eligibility without consuming input.
binditn = Super, catchall, exec, @HOME@/.local/bin/nyvorel-super-scroll cancel
bind = Ctrl, Super_L, exec, @HOME@/.local/bin/nyvorel-super-scroll cancel
bind = Ctrl, Super_R, exec, @HOME@/.local/bin/nyvorel-super-scroll cancel

# Mouse buttons also cancel a pure Super tap. Keep the established button set.
bind = Super, mouse:272, exec, @HOME@/.local/bin/nyvorel-super-scroll cancel
bind = Super, mouse:273, exec, @HOME@/.local/bin/nyvorel-super-scroll cancel
bind = Super, mouse:274, exec, @HOME@/.local/bin/nyvorel-super-scroll cancel
bind = Super, mouse:275, exec, @HOME@/.local/bin/nyvorel-super-scroll cancel
bind = Super, mouse:276, exec, @HOME@/.local/bin/nyvorel-super-scroll cancel
bind = Super, mouse:277, exec, @HOME@/.local/bin/nyvorel-super-scroll cancel

# Upstream uses Super+wheel for workspace switching. Remove those earlier binds,
# then re-register wheel activity ONLY as a non-consuming tap-cancel marker.
# This preserves scrolling in the focused application while Super is held.
unbind = Super, mouse_up
unbind = Super, mouse_down
bindn = Super, mouse_up, exec, @HOME@/.local/bin/nyvorel-super-scroll cancel
bindn = Super, mouse_down, exec, @HOME@/.local/bin/nyvorel-super-scroll cancel

# Horizontal two-finger/axis scrolling should also cancel tap eligibility while
# continuing through to the focused application.
bindn = Super, mouse_left, exec, @HOME@/.local/bin/nyvorel-super-scroll cancel
bindn = Super, mouse_right, exec, @HOME@/.local/bin/nyvorel-super-scroll cancel
