[package]
name = "nyvorel-wallpaper-utils"
version = "0.1.2"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico", "pnm", "hdr", "qoi"] }
imageproc = { version = "0.27", default-features = false }
md5 = "0.8"
png = "0.18"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
