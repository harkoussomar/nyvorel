[package]
name = "nyvorel-arch-remote"
version = "0.1.1"
edition = "2021"
publish = false

[dependencies]
base64 = "0.23"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
url = { version = "2.5", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
